    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<!-- Navbar -->
<div id="navbar-container"></div>

<div class="wrapper">

    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main Content -->
    <div class="main-content">

    <h1 class="mb-4">Admin Product Management</h1>

    <!-- Product Form -->
    <!-- Toggle Button -->
    <button
        id="toggleAddFormBtn"
        class="btn btn-primary"
        onclick="toggleAddProductForm()">

        <i class="fa-solid fa-plus"></i>
        Add New Product

    </button>

<!-- Add Product Form -->
<div
    id="addProductFormContainer"
    class="card p-4 mb-1 add-product-form">

    <h4 class="">
        Add Product
    </h4>

    <div class="mb-3">
        <label>Name</label>
        <input
            type="text"
            id="name"
            class="form-control">
    </div>

    <div class="mb-3">
        <label>Price</label>
        <input
            type="number"
            id="price"
            class="form-control">
    </div>

    <div class="mb-3">
        <label>Description</label>
        <textarea
            id="description"
            class="form-control"></textarea>
    </div>

    <div class="mb-3">
        <label>Stock Quantity</label>
        <input
            type="number"
            id="stockQuantity"
            class="form-control">
    </div>

    <button
        class="btn btn-success"
        onclick="addProduct()">

        <i class="fa-solid fa-floppy-disk"></i>
        Save Product

    </button>

</div>

    <!-- Product List -->
    <div class="mt-1">

        <h3>Products</h3>

        <!-- Search -->
        <input
            type="text"
            id="searchInput"
            class="form-control w-25 mb-2"
            placeholder="Search products..."
            onkeyup="searchProducts()"
        >

        <table class="table table-bordered">

            <thead>
            <tr>
                <th onclick="sortProducts('id')">ID</th>
                <th onclick="sortProducts('name')">Name</th>
                <th onclick="sortProducts('price')">Price</th>
                <th onclick="sortProducts('stockQuantity')">Stock</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody id="productTableBody">

            </tbody>

        </table>

    </div>

    </div>

</div>

<!-- Modal popup -->
<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Edit Product
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <form id="editProductForm">

                    <div class="mb-3">
                        <label>Name</label>
                        <input type="text" id="editName" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>Description</label>
                        <input type="text" id="editDescription" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>Price</label>
                        <input type="number" step="any" id="editPrice" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>Stock Quantity</label>
                        <input type="number" id="editStockQuantity" class="form-control">
                    </div>

                    <button type="submit" class="btn btn-warning">
                        Update Product
                    </button>
                    
                </form>

            </div>

        </div>

    </div>

</div>

<!-- Delete Confirm Modal -->

<div
    class="modal fade"
    id="deleteModal"
    tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">

                    Confirm Delete

                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                Are you sure you want to delete this product?

            </div>

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancel

                </button>

                <button
                    type="button"
                    class="btn btn-danger"
                    onclick="confirmDeleteProduct()">

                    <i class="fa-solid fa-trash"></i>

                    Delete

                </button>

            </div>

        </div>

    </div>

</div>

<!-- Toast notification -->
<div id="toast-container"></div>

<script src="./js/components/loadComponents.js"></script>
<script src="./js/admin-products.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="./js/components/toast.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
