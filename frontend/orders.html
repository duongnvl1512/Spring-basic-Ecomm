<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Orders</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="./css/style.css">

</head>

<body>

<!-- Navbar -->
<div id="navbar-container"></div>

<div class="wrapper">

    <div id="sidebar-container"></div>

    <div class="main-content">

        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4 border-bottom pb-3">
            <div>
                <h1 class="h2 mb-1 text-dark fw-bold">Orders Management</h1>
                <p class="text-muted mb-0 small">Track, review, and manage customer orders and fulfillment states.</p>
            </div>
            
            <div class="input-group" style="max-width: 320px;">
                <span class="input-group-text bg-white border-end-0 text-muted">
                    <i class="bi bi-search"></i>
                </span>
                <input 
                    type="text" 
                    id="searchOrderInput" 
                    class="form-control border-start-0 ps-0" 
                    placeholder="Search orders by ID, customer..." 
                    onkeyup="searchOrders()"
                >
            </div>
        </div>

        <div class="card shadow-sm border-0 rounded-3 p-4">
            <div class="d-flex align-items-center gap-2 mb-3">
                <h3 class="h5 mb-0 fw-bold text-dark">Recent Orders</h3>
                <span class="badge bg-secondary-subtle text-secondary rounded-pill dynamic-order-count">Manage</span>
            </div>
            
            <div id="ordersContainer">
                </div>
        </div>

    </div>

</div>

<div class="modal fade" id="orderDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">

            <div class="modal-header bg-light">
                <h5 class="modal-title fw-bold text-dark">
                    <i class="bi bi-receipt me-2 text-primary"></i>Order Invoice Detail
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body p-4" id="orderDetailContent">
                </div>
            
            <div class="modal-footer bg-light border-top-0 py-2">
                <button type="button" class="btn btn-secondary px-4 btn-sm" data-bs-dismiss="modal">Close</button>
            </div>

        </div>
    </div>
</div>

<!-- Toast notification -->
<div id="toast-container"></div>

<script src="./js/components/loadComponents.js"></script>
<script src="./js/orders.js"></script>
<script src="./js/components/toast.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
